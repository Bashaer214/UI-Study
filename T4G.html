<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>⏱️ Speed Quiz | Timed Challenge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', 'Inter', 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* main app card */
    .quiz-container {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 2.5rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      backdrop-filter: blur(0px);
      transition: all 0.2s ease;
    }

    /* header with timer + question counter */
    .quiz-header {
      background: #ffffff;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid #e9edf2;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .question-counter {
      background: #f0f3f8;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #1e2f3e;
      letter-spacing: -0.2px;
    }

    .timer-box {
      background: #1e2f3e;
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: white;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .timer-icon {
      font-size: 1.2rem;
    }

    .timer-value {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: monospace;
      letter-spacing: 1px;
      background: #00000030;
      padding: 0 0.3rem;
      border-radius: 12px;
      min-width: 62px;
      text-align: center;
    }

    .timer-warning {
      background: #c44536;
      animation: pulse 0.7s infinite alternate;
    }

    @keyframes pulse {
      0% { background: #c44536; box-shadow: 0 0 0 0 #ff8a5c; }
      100% { background: #b1301f; box-shadow: 0 0 0 4px rgba(196, 69, 54, 0.3); }
    }

    /* main question area */
    .quiz-body {
      padding: 2rem 2rem 1.8rem;
    }

    .question-text {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 2rem;
      color: #0f212e;
    }

    /* options grid */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .option-item {
      background: #f8fafd;
      border: 1.5px solid #e2e8f0;
      border-radius: 1.2rem;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-weight: 500;
      color: #1f3a4b;
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-prefix {
      width: 32px;
      height: 32px;
      background: #eef2f8;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #2c4c6c;
    }

    .option-item:hover:not(.disabled-opt) {
      background: #eef3fc;
      border-color: #90b4d4;
      transform: scale(0.99);
    }

    .selected-option {
      background: #e0f0ff;
      border-color: #2c7da0;
      box-shadow: 0 2px 6px rgba(44,125,160,0.2);
    }

    .disabled-opt {
      cursor: default;
      opacity: 0.8;
    }

    /* next button + footer */
    .quiz-footer {
      padding: 0.5rem 2rem 2rem 2rem;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      background: #2c7da0;
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.85rem 2rem;
      border-radius: 3rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .next-btn:hover:not(:disabled) {
      background: #1f6390;
      transform: translateY(-2px);
    }

    .next-btn:disabled {
      background: #b9cfdf;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* score screen */
    .score-screen {
      text-align: center;
      padding: 2rem 1.5rem 2.5rem;
    }

    .score-circle {
      background: #eef3fc;
      width: 150px;
      height: 150px;
      margin: 1.5rem auto;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 0 4px white, 0 12px 24px rgba(0,0,0,0.1);
    }

    .score-number {
      font-size: 3.8rem;
      font-weight: 800;
      color: #1f6390;
      line-height: 1;
    }

    .score-label {
      font-size: 1rem;
      font-weight: 500;
      color: #2c4c6c;
    }

    .play-again-btn {
      background: #1e2f3e;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      border-radius: 3rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: 0.2s;
    }

    .play-again-btn:hover {
      background: #0f1f2c;
      transform: scale(0.97);
    }

    .final-message {
      font-size: 1.2rem;
      margin-top: 0.5rem;
      color: #2d5f7e;
    }

    hr {
      margin: 1rem 0;
    }

    @media (max-width: 550px) {
      .quiz-body {
        padding: 1.5rem;
      }
      .question-text {
        font-size: 1.4rem;
      }
      .timer-value {
        font-size: 1.2rem;
        min-width: 50px;
      }
      .option-item {
        padding: 0.7rem 1rem;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container" id="quizRoot">
  <!-- dynamic content injected via JS -->
</div>

<script>
  // ---------- QUIZ DATA ----------
  const QUESTIONS = [
    {
      text: "Which planet is known as the Red Planet?",
      options: ["Mars", "Jupiter", "Venus", "Saturn"],
      correct: 0  // index of correct answer
    },
    {
      text: "What is the capital city of Japan?",
      options: ["Seoul", "Beijing", "Tokyo", "Bangkok"],
      correct: 2
    },
    {
      text: "Who painted the Mona Lisa?",
      options: ["Van Gogh", "Picasso", "Da Vinci", "Rembrandt"],
      correct: 2
    },
    {
      text: "Which language runs in a web browser?",
      options: ["Java", "C", "Python", "JavaScript"],
      correct: 3
    },
    {
      text: "What does HTML stand for?",
      options: ["Hyper Text Markup Language", "Home Tool Markup Language", "Hyperlinks and Text Markup", "High Tech Modern Language"],
      correct: 0
    }
  ];

  // -------- APP STATE ----------
  let currentQuestionIndex = 0;          // 0-based
  let userAnswers = new Array(QUESTIONS.length).fill(null);   // stores selected option index or null
  let timerInterval = null;
  let timeLeft = 15;                     // seconds per question
  const TIME_PER_QUESTION = 15;
  let quizActive = true;                 // if false, timer stops & UI locked (between or at end)
  let isAnswered = false;                // lock answer selection after choosing or time out

  // DOM elements reference (will be set in render)
  let rootEl = null;

  // Helper: stop any running timer
  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  // start timer for current question, only if quizActive and not answered yet
  function startTimerForCurrent() {
    if (!quizActive) return;
    if (isAnswered) return;   // already answered, no timer needed
    stopTimer(); // ensure clean
    
    timerInterval = setInterval(() => {
      // extra safety: if quiz not active or answered, clear timer
      if (!quizActive || isAnswered) {
        if (!quizActive || isAnswered) {
          stopTimer();
        }
        return;
      }
      
      if (timeLeft <= 1) {
        // TIME'S UP for this question
        if (!isAnswered) {
          // auto mark as no answer selected (keep null) and move to next if possible
          stopTimer();
          // if no answer recorded, we treat as unanswered -> no points added, but we must lock
          if (userAnswers[currentQuestionIndex] === null) {
            // already null, fine
            isAnswered = true;
          }
          // re-render to reflect timeout (disable options and show timeout effect)
          renderCurrentQuestion();
          
          // after short delay, auto move to next or finish?
          // but avoid double triggers: if quiz still active, call nextQuestion logic
          if (quizActive) {
            // small timeout so user sees timer hit 0
            setTimeout(() => {
              if (quizActive && !isAnswered) return; // already handled, but extra guard
              // move to next if not finished
              if (currentQuestionIndex + 1 < QUESTIONS.length) {
                goToNextQuestion();
              } else if (currentQuestionIndex === QUESTIONS.length - 1) {
                finishQuiz();
              }
            }, 500);
          }
        }
      } else {
        timeLeft--;
        updateTimerDisplay();
        // add visual warning if time <= 5 sec
        const timerBox = document.querySelector('.timer-box');
        if (timeLeft <= 5 && timerBox && !timerBox.classList.contains('timer-warning')) {
          timerBox.classList.add('timer-warning');
        } else if (timeLeft > 5 && timerBox && timerBox.classList.contains('timer-warning')) {
          timerBox.classList.remove('timer-warning');
        }
      }
    }, 1000);
  }

  // update timer UI
  function updateTimerDisplay() {
    const timerSpan = document.querySelector('.timer-value');
    if (timerSpan) timerSpan.innerText = timeLeft;
    // also apply warning style again if needed
    const timerBox = document.querySelector('.timer-box');
    if (timeLeft <= 5 && timerBox && !timerBox.classList.contains('timer-warning')) {
      timerBox.classList.add('timer-warning');
    } else if (timeLeft > 5 && timerBox && timerBox.classList.contains('timer-warning')) {
      timerBox.classList.remove('timer-warning');
    }
  }

  // handle user selecting an option
  function selectOption(selectedIdx) {
    // validation: quiz must be active, not already answered, timer active or not finished
    if (!quizActive) return;
    if (isAnswered) return;
    if (userAnswers[currentQuestionIndex] !== null) return; // already answered
    
    // record answer
    userAnswers[currentQuestionIndex] = selectedIdx;
    isAnswered = true;
    
    // stop timer immediately
    stopTimer();
    
    // re-render to show selected option, disable further clicks
    renderCurrentQuestion();
    
    // optional: automatic next? user must click next (spec requirement: "next question navigation")
    // So we enable Next button and user must click next. That's fine.
    // BUT we also need to ensure that after answering, timer won't restart.
    // Next button will become enabled (since isAnswered = true)
  }
  
  // go to next question or finish
  function goToNextQuestion() {
    if (!quizActive) return;
    // if current question is unanswered but time didn't run out? Actually user must answer or timeout,
    // But next button is disabled until answered or timeout (isAnswered flag). Double-check:
    if (!isAnswered && userAnswers[currentQuestionIndex] === null) {
      // not answered yet, cannot proceed. Next button is disabled anyway, but just safety
      return;
    }
    
    // move to next if available
    if (currentQuestionIndex + 1 < QUESTIONS.length) {
      // advance index
      currentQuestionIndex++;
      // reset per-question state
      isAnswered = (userAnswers[currentQuestionIndex] !== null); // if previously answered via back? we don't have back but ok
      // but in normal flow, next question fresh, no answer yet
      // however if somehow restored (not needed) but fresh:
      if (userAnswers[currentQuestionIndex] === null) {
        isAnswered = false;
      } else {
        isAnswered = true;
      }
      timeLeft = TIME_PER_QUESTION;
      stopTimer();
      // if current question not yet answered, start timer; else just render (if previously answered, no timer)
      renderCurrentQuestion();
      if (!isAnswered && quizActive) {
        startTimerForCurrent();
      } else {
        // already answered, just show selected, no timer running
        if (timerInterval) stopTimer();
        updateTimerDisplay(); // show full time but it's irrelevant but we keep display
      }
    } else {
      // last question, finish quiz if next pressed on last question?
      finishQuiz();
    }
  }
  
  // finish quiz, calculate final score & show results
  function finishQuiz() {
    if (!quizActive) return;
    quizActive = false;
    stopTimer();
    
    // calculate final score
    let score = 0;
    for (let i = 0; i < QUESTIONS.length; i++) {
      const userChoice = userAnswers[i];
      if (userChoice !== null && userChoice === QUESTIONS[i].correct) {
        score++;
      }
    }
    const total = QUESTIONS.length;
    renderScoreScreen(score, total);
  }
  
  // render final score UI
  function renderScoreScreen(score, total) {
    const percent = Math.round((score / total) * 100);
    let message = "";
    if (percent === 100) message = "🌟 Perfect! Genius!";
    else if (percent >= 80) message = "🎉 Great job! Keep it up!";
    else if (percent >= 60) message = "👍 Good effort! Almost there.";
    else if (percent >= 40) message = "📚 Nice try! Review a bit more.";
    else message = "💪 Keep practicing! You'll improve.";
    
    const html = `
      <div class="score-screen">
        <h2 style="color:#1f3a4b;">📊 Quiz Completed</h2>
        <div class="score-circle">
          <div class="score-number">${score}/${total}</div>
          <div class="score-label">Final Score</div>
        </div>
        <div class="final-message">${message}</div>
        <button class="play-again-btn" id="restartQuizBtn">⟳ Play Again</button>
      </div>
    `;
    rootEl.innerHTML = html;
    const restartBtn = document.getElementById('restartQuizBtn');
    if (restartBtn) {
      restartBtn.addEventListener('click', () => restartQuiz());
    }
  }
  
  // restart full quiz
  function restartQuiz() {
    // reset all state
    stopTimer();
    currentQuestionIndex = 0;
    userAnswers = new Array(QUESTIONS.length).fill(null);
    timeLeft = TIME_PER_QUESTION;
    quizActive = true;
    isAnswered = false;
    // clear any timers
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    // render first question
    renderCurrentQuestion();
    startTimerForCurrent();
  }
  
  // main rendering: current question, options, next button state, timer display
  function renderCurrentQuestion() {
    if (!quizActive && rootEl.innerHTML.includes('score-screen')) return; // score already shown
    if (!quizActive) return;
    
    const question = QUESTIONS[currentQuestionIndex];
    const selectedIdx = userAnswers[currentQuestionIndex]; // could be null
    const isCurrAnswered = (selectedIdx !== null);
    // override isAnswered flag to match current selection
    isAnswered = isCurrAnswered;
    
    // build options html
    let optionsHtml = '';
    question.options.forEach((opt, idx) => {
      const isSelected = (selectedIdx === idx);
      const selectedClass = isSelected ? 'selected-option' : '';
      const disabledClass = isAnswered ? 'disabled-opt' : '';
      const prefixLetter = String.fromCharCode(65 + idx); // A, B, C, D
      optionsHtml += `
        <div class="option-item ${selectedClass} ${disabledClass}" data-opt-index="${idx}">
          <span class="option-prefix">${prefixLetter}</span>
          <span>${escapeHtml(opt)}</span>
        </div>
      `;
    });
    
    const nextDisabled = (!isAnswered) ? 'disabled' : '';
    const nextButtonText = (currentQuestionIndex === QUESTIONS.length - 1) ? '🏁 Finish Quiz' : 'Next ➡';
    
    const totalQ = QUESTIONS.length;
    const progressText = `Question ${currentQuestionIndex+1} of ${totalQ}`;
    
    const html = `
      <div class="quiz-header">
        <div class="question-counter">📌 ${progressText}</div>
        <div class="timer-box">
          <span class="timer-icon">⏱️</span>
          <span class="timer-value" id="quizTimerValue">${timeLeft}</span>
          <span>sec</span>
        </div>
      </div>
      <div class="quiz-body">
        <div class="question-text">${escapeHtml(question.text)}</div>
        <div class="options-list" id="optionsContainer">
          ${optionsHtml}
        </div>
      </div>
      <div class="quiz-footer">
        <button class="next-btn" id="nextQuestionBtn" ${nextDisabled}>${nextButtonText}</button>
      </div>
    `;
    
    rootEl.innerHTML = html;
    
    // attach option event listeners (only if not answered)
    if (!isAnswered) {
      const optDivs = document.querySelectorAll('.option-item');
      optDivs.forEach(optDiv => {
        optDiv.addEventListener('click', (e) => {
          // prevent bubbling, check if disabled class or isAnswered
          if (isAnswered) return;
          const idx = parseInt(optDiv.dataset.optIndex);
          if (!isNaN(idx)) {
            selectOption(idx);
          }
        });
      });
    } else {
      // if already answered, we still attach but with no effect? Better to avoid but just make them inert
      const optDivs = document.querySelectorAll('.option-item');
      optDivs.forEach(opt => {
        opt.style.cursor = 'default';
        opt.addEventListener('click', (e) => e.stopPropagation());
      });
    }
    
    // attach next button event
    const nextBtn = document.getElementById('nextQuestionBtn');
    if (nextBtn) {
      nextBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (nextBtn.disabled) return;
        if (!isAnswered) return; // extra safety
        if (currentQuestionIndex === QUESTIONS.length - 1) {
          finishQuiz();
        } else {
          goToNextQuestion();
        }
      });
    }
    
    // sync timer display text after each re-render
    const timerSpan = document.getElementById('quizTimerValue');
    if (timerSpan) timerSpan.innerText = timeLeft;
    const timerBoxDiv = document.querySelector('.timer-box');
    if (timeLeft <= 5 && timerBoxDiv && !timerBoxDiv.classList.contains('timer-warning')) {
      timerBoxDiv.classList.add('timer-warning');
    } else if (timeLeft > 5 && timerBoxDiv && timerBoxDiv.classList.contains('timer-warning')) {
      timerBoxDiv.classList.remove('timer-warning');
    }
  }
  
  // simple escape to prevent XSS
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }
  
  // initial render and bootstrap
  function initApp() {
    rootEl = document.getElementById('quizRoot');
    if (!rootEl) return;
    quizActive = true;
    currentQuestionIndex = 0;
    userAnswers.fill(null);
    timeLeft = TIME_PER_QUESTION;
    isAnswered = false;
    stopTimer();
    renderCurrentQuestion();
    startTimerForCurrent();
  }
  
  // on page load, init everything
  window.addEventListener('DOMContentLoaded', () => {
    rootEl = document.getElementById('quizRoot');
    if (rootEl) {
      initApp();
    } else {
      console.error("Root element missing");
    }
  });
</script>
</body>
</html>
