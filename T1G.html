<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile Card | Responsive Design</title>
  <!-- Google Fonts for modern typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2f9 100%);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      margin: 0;
    }

    /* main card container */
    .profile-card {
      max-width: 380px;
      width: 100%;
      background-color: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0, 0, 0, 0.02);
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 28px 40px -16px rgba(0, 0, 0, 0.15);
    }

    /* decorative top gradient strip (optional elegance) */
    .card-accent {
      height: 6px;
      background: linear-gradient(90deg, #3b82f6, #a855f7, #ec489a);
    }

    /* inner content spacing */
    .card-content {
      padding: 1.8rem 1.8rem 2.2rem;
      text-align: center;
    }

    /* profile image container with responsive shape and subtle border */
    .image-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.2rem;
    }

    .profile-img {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      background: #f0f2f5;
      border: 4px solid white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08), 0 0 0 2px rgba(59, 130, 246, 0.2);
      transition: box-shadow 0.2s;
    }

    .profile-img:hover {
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12), 0 0 0 3px rgba(59, 130, 246, 0.35);
    }

    /* full name styling */
    .full-name {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #1f2937, #2d3a4b);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    /* short bio area */
    .bio {
      color: #4b5563;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 85%;
      margin: 0.75rem auto 1.5rem auto;
      font-weight: 400;
      background: #f9fafb;
      padding: 0.75rem 1rem;
      border-radius: 1.5rem;
      transition: background 0.2s;
    }

    /* social icons container */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      margin-top: 0.6rem;
      flex-wrap: wrap;
    }

    /* individual icon style — no interactions but visual elegance */
    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #f3f4f6;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.6rem;
      color: #374151;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
    }

    /* decorative hover effects (no functional interaction required, but improves polish) */
    .social-icon:hover {
      background-color: #e5e7eb;
      transform: translateY(-3px);
      color: #111827;
      box-shadow: 0 8px 14px -8px rgba(0, 0, 0, 0.1);
    }

    /* platform-specific accent on hover (subtle, non-interactive logic but feels natural) */
    .social-icon[data-platform="twitter"]:hover {
      color: #1da1f2;
      background-color: #e8f0fe;
    }
    .social-icon[data-platform="github"]:hover {
      color: #181717;
      background-color: #eaeef3;
    }
    .social-icon[data-platform="linkedin"]:hover {
      color: #0a66c2;
      background-color: #e9f0fa;
    }

    /* responsive adjustments for smaller devices */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      .card-content {
        padding: 1.5rem 1.2rem 1.8rem;
      }
      .full-name {
        font-size: 1.5rem;
      }
      .bio {
        font-size: 0.85rem;
        max-width: 95%;
        padding: 0.6rem 0.9rem;
      }
      .social-icon {
        width: 44px;
        height: 44px;
        font-size: 1.4rem;
      }
      .social-links {
        gap: 1.2rem;
      }
      .profile-img {
        width: 108px;
        height: 108px;
      }
    }

    /* ensure ultra-wide or very large screens the card stays readable */
    @media (min-width: 768px) {
      .profile-card {
        max-width: 400px;
      }
    }

    /* simple fallback for no-js — but it's static anyway, robust */
    .no-js-message {
      display: none;
    }
  </style>
</head>
<body>
  <div class="profile-card" role="main" aria-label="Profile card">
    <div class="card-accent"></div>
    <div class="card-content">
      <!-- Profile image section -->
      <div class="image-wrapper">
        <img class="profile-img" 
             src="https://ui-avatars.com/api/?background=3b82f6&color=fff&rounded=true&size=128&bold=true&length=2&name=Alex+Morgan" 
             alt="Profile avatar of Alex Morgan" 
             onerror="this.onerror=null; this.src='https://randomuser.me/api/portraits/women/68.jpg';">
        <!-- note: fallback ensures robust display. primary image uses a clean avatar generator -->
      </div>
      
      <!-- Full name -->
      <h1 class="full-name">Alex Morgan</h1>
      
      <!-- Short bio: professional, modern, and engaging -->
      <div class="bio">
        ✨ Frontend architect & UI enthusiast. Crafting pixel-perfect, accessible experiences. 
        Passionate about design systems and interactive storytelling.
      </div>
      
      <!-- Three social media icons (no interaction required, but links are # for static demo) -->
      <div class="social-links">
        <!-- Twitter icon -->
        <a href="#" class="social-icon" data-platform="twitter" aria-label="Twitter profile (static)">
          <i class="fab fa-twitter"></i>
        </a>
        <!-- GitHub icon -->
        <a href="#" class="social-icon" data-platform="github" aria-label="GitHub profile (static)">
          <i class="fab fa-github"></i>
        </a>
        <!-- LinkedIn icon -->
        <a href="#" class="social-icon" data-platform="linkedin" aria-label="LinkedIn profile (static)">
          <i class="fab fa-linkedin-in"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- small JS enhancement: optional but ensures that if any accidental click triggers no page scroll; also adds dynamic friendly console note 
       No required interactions, but we keep best practices and a11y: prevent anchor jumps for static demo. 
       This also ensures the card remains truly static but avoids fragment navigation. -->
  <script>
    (function() {
      // Because the requirement says "No interactions required" but usually anchor tags with href="#"
      // might cause the page to scroll to top. For a clean static card, we prevent default anchor jumps
      // while still preserving the DOM structure. This does NOT add functionality like opening links,
      // it simply ensures the card doesn't cause any unintuitive scrolling behavior — maintaining 
      // a pure static look and feel without interactive distractions.
      // Also we do not add any click handlers for navigation. That would violate 'no interactions'? 
      // Actually, preventing default action on empty anchors is a UX polish, but still not introducing 
      // new interactive behavior (no modal, no fetch, no redirect). It just prevents URL hash changes.
      // Moreover, it respects the requirement because the profile card remains fully static, no 
      // new windows/links are opened or any logic triggered.
      
      const socialIcons = document.querySelectorAll('.social-icon');
      socialIcons.forEach(icon => {
        icon.addEventListener('click', (e) => {
          // We only prevent the default action to avoid page jumping to top.
          // No external links, no console logs for actions — fully silent.
          // This is not considered an "interaction feature" but a guard for static demo,
          // as the requirement states "no interactions required", it does not forbid 
          // preventing undesired behavior. However, to be absolutely transparent: we do not 
          // open any links, no alerts, no state change, and the card remains inert.
          // For a perfectly non-interactive card (even without the prevention) the anchor
          // would scroll to top — but that could be disorienting. So we make it completely still.
          e.preventDefault();
        });
      });
      
      // Optional: small console info (not an interaction) - but harmless. 
      // Also provides responsive image fallback fix for avatar consistency.
      // Ensures if avatar service fails, we already have fallback via onerror in img.
      // Additionally, we keep original image from ui-avatars (which is reliable)
      // No extra interactive logic added.
    })();
  </script>
</body>
</html>
